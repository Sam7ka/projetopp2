<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Máquinas com Defeito</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
    input, textarea, button { padding: 8px; font-size: 16px; }
    .card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
    .status { font-weight: bold; color: orange; }
    .status.Resolvido { color: green; }
    .btn-delete { background-color: #ff4d4d; color: white; border: none; cursor: pointer; padding: 5px 10px;}
    .btn-update { background-color: #4da6ff; color: white; border: none; cursor: pointer; padding: 5px 10px; }
  </style>
</head>
<body>

  <h1>Relatar Máquina com Defeito</h1>
  
  <form id="formRelatorio">
    <input type="text" id="maquina" placeholder="Nome ou ID da Máquina (ex: PC-01)" required>
    <textarea id="descricao" placeholder="Descreva o problema constatado..." style="resize: none;" required></textarea>
    <button type="submit">Enviar Relatório</button>
  </form>

  <h2>Relatórios Enviados</h2>
  <div id="listaRelatorios"></div>

  <script>
    const form = document.getElementById('formRelatorio');
    const lista = document.getElementById('listaRelatorios');

    // Função para buscar relatórios do backend (READ)
    async function carregarRelatorios() {
      const response = await fetch('/api/relatorios');
      const relatorios = await response.json();
      
      lista.innerHTML = '';
      relatorios.forEach(rel => {
        lista.innerHTML += `
          <div class="card">
            <h3>${rel.maquina}</h3>
            <p>${rel.descricao}</p>
            <p>Status: <span class="status ${rel.status}">${rel.status}</span></p>
            <button class="btn-delete" onclick="deletarRelatorio(${rel.id})">Excluir</button>
          </div>
        `;
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const maquina = document.getElementById('maquina').value;
      const descricao = document.getElementById('descricao').value;

      await fetch('/api/relatorios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ maquina, descricao })
      });

      form.reset();
      carregarRelatorios();
    });

    async function atualizarStatus(id, novoStatus) {
      await fetch(`/api/relatorios/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: novoStatus })
      });
      carregarRelatorios();
    }

    async function deletarRelatorio(id) {
      if (confirm('Deseja mesmo excluir este aviso?')) {
        await fetch(`/api/relatorios/${id}`, { method: 'DELETE' });
        carregarRelatorios();
      }
    }

    carregarRelatorios();
  </script>
</body>
</html>
